/* =============================================================
   ANIMATED COUNTERS
   ============================================================= */
function animateCounters(scope){
  const targets = (scope||document).querySelectorAll('.kpi-value[data-target]');
  targets.forEach(elm=>{
    const target = parseFloat(elm.dataset.target);
    const suffix = elm.dataset.suffix || '';
    if(isNaN(target)){ elm.textContent = elm.dataset.target; return; }
    const dur = 850;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-t, 3);
      const val = Math.round(target * eased);
      elm.textContent = val + suffix;
      if(t<1) requestAnimationFrame(tick);
      else elm.textContent = target + suffix;
    }
    requestAnimationFrame(tick);
  });
}

/* =============================================================
   CONFETTI — sparing, only fires once per session per season
   ============================================================= */
const confettiFired = new Set();
function fireConfetti(key){
  if(confettiFired.has(key)) return;
  confettiFired.add(key);
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#C9A961','#E8D9B4','#980B2C','#FAFAF7'];
  const particles = [];
  for(let i=0;i<60;i++){
    particles.push({
      x: window.innerWidth*(0.25+Math.random()*0.5),
      y: -20 - Math.random()*120,
      vx: (Math.random()-0.5)*3.5,
      vy: 2 + Math.random()*3,
      r: 3 + Math.random()*3.5,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.22,
      shape: Math.random()<0.5?'rect':'circle',
      life: 1
    });
  }
  const start = performance.now();
  function draw(now){
    const elapsed = now - start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p=>{
      p.vy += 0.08;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.life = Math.max(0, 1 - elapsed/3000);
      if(p.y < canvas.height+30 && p.life>0){
        alive = true;
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if(p.shape==='rect') ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r);
        else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      }
    });
    if(alive) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(draw);
}

/* =============================================================
   DID YOU KNOW
   ============================================================= */
function buildFacts(scope){
  const facts = [];
  if(scope==='ALL'){
    const totals = DATA.totals;
    const seasons = DATA.seasons;
    const horseMap = {};
    seasons.forEach(s=>s.winners.forEach(w=>{
      const k=(w.name||'').toUpperCase();
      horseMap[k] = (horseMap[k] || {name:w.name, origin:w.origin, wins:0, trainer:w.trainer});
      horseMap[k].wins++;
    }));
    const topHorse = Object.values(horseMap).sort((a,b)=>b.wins-a.wins)[0];
    if(topHorse) facts.push(`The all-time leading international horse at BTC is <strong>${topHorse.name}${topHorse.origin?' ('+topHorse.origin+')':''}</strong>, with <strong>${topHorse.wins}</strong> international wins on the board.`);
    const trainerMap = {};
    seasons.forEach(s=>s.register.forEach(h=>{
      if(!h.trainer) return;
      trainerMap[h.trainer] = (trainerMap[h.trainer] || {name:h.trainer, wins:0});
      trainerMap[h.trainer].wins += (h.wins||0);
    }));
    const topT = Object.values(trainerMap).sort((a,b)=>b.wins-a.wins)[0];
    if(topT) facts.push(`<strong>${topT.name}</strong> leads the all-time international trainer charts at BTC with <strong>${topT.wins}</strong> wins.`);
    const busy = [...seasons].sort((a,b)=>b.stats.horses-a.stats.horses)[0];
    if(busy) facts.push(`The most internationally attended season was <strong>${busy.season}</strong>, with <strong>${busy.stats.horses}</strong> overseas runners.`);
    const wonMost = [...seasons].sort((a,b)=>b.stats.wins-a.stats.wins)[0];
    if(wonMost) facts.push(`International raiders enjoyed their biggest haul in <strong>${wonMost.season}</strong>, banking <strong>${wonMost.stats.wins}</strong> wins between them.`);
    facts.push(`Across <strong>${totals.seasons}</strong> tracked seasons, <strong>${totals.horses}</strong> international horses have run at BTC.`);
    facts.push(`Runners have arrived from <strong>${totals.countries.length}</strong> different nations: ${totals.countries.join(', ')}.`);
  } else {
    const s = DATA.seasons.find(x=>x.season===scope);
    if(!s) return facts;
    const st = s.stats;
    const gb = s.register.filter(h=>h.country==='GB').length;
    if(gb>0 && st.horses>0) facts.push(`<strong>Great Britain</strong> sent <strong>${gb}</strong> of the <strong>${st.horses}</strong> international runners this season — <strong>${Math.round(gb/st.horses*100)}%</strong> of the entire overseas field.`);
    if(st.dual_winners>0){
      const duals = s.register.filter(h=>h.wins>=2);
      facts.push(`<strong>${duals.length}</strong> ${duals.length===1?'horse':'horses'} won multiple races this season: ${duals.map(d=>`<strong>${d.name}</strong>`).join(' and ')}.`);
    }
    const tm = {};
    s.register.forEach(h=>{
      if(!h.trainer) return;
      tm[h.trainer] = (tm[h.trainer] || {name:h.trainer, wins:0, runs:0});
      tm[h.trainer].wins += (h.wins||0); tm[h.trainer].runs++;
    });
    const top = Object.values(tm).sort((a,b)=>b.wins-a.wins||b.runs-a.runs)[0];
    if(top && top.wins>0) facts.push(`<strong>${top.name}</strong> led the trainers' table this season with <strong>${top.wins}</strong> ${top.wins===1?'win':'wins'} from <strong>${top.runs}</strong> ${top.runs===1?'runner':'runners'}.`);
    if(st.horses) facts.push(`The <strong>${scope}</strong> international field represented <strong>${st.countries.length}</strong> nation${st.countries.length===1?'':'s'}: <strong>${st.countries.join(', ')}</strong>.`);
    if(st.wins) facts.push(`A strike rate of <strong>${Math.round(st.individual_winners/st.horses*100)}%</strong> — <strong>${st.individual_winners}</strong> of the <strong>${st.horses}</strong> runners visited the winner's enclosure.`);
  }
  return facts.filter(Boolean);
}
function mountDidYouKnow(parent, scope){
  const facts = buildFacts(scope);
  if(!facts.length) return;
  let idx = Math.floor(Math.random() * facts.length);
  const node = el('div',{class:'dyk'});
  node.append(
    el('div',{class:'dyk-icon'}, '?'),
    el('div',{class:'dyk-content'},
      el('div',{class:'dyk-label'},'Did you know'),
      el('div',{class:'dyk-text', id:'dykText'})
    )
  );
  const btn = el('button',{class:'dyk-next'}, 'Next →');
  node.append(btn);
  parent.append(node);
  function paint(){
    const txt = document.getElementById('dykText');
    if(!txt) return;
    txt.style.opacity = '0';
    setTimeout(()=>{ txt.innerHTML = facts[idx]; txt.style.opacity = '1'; }, 180);
  }
  paint();
  btn.addEventListener('click', ()=>{ idx = (idx+1)%facts.length; paint(); });
  if(window._dykTimer) clearInterval(window._dykTimer);
  window._dykTimer = setInterval(()=>{ idx = (idx+1)%facts.length; paint(); }, 9000);
}

/* =============================================================
   HALL OF FAME
   ============================================================= */
function buildHallOfFame(){
  const out = [];
  const sList = DATA.seasons;
  const horseMap = {};
  sList.forEach(s=>s.winners.forEach(w=>{
    const k=(w.name||'').toUpperCase(); if(!k) return;
    horseMap[k] = horseMap[k] || {name:w.name, origin:w.origin, wins:0, trainer:w.trainer, seasons:new Set()};
    horseMap[k].wins++; horseMap[k].seasons.add(s.season);
  }));
  const horseR = Object.values(horseMap).sort((a,b)=>b.wins-a.wins||b.seasons.size-a.seasons.size)[0];
  if(horseR) out.push({
    icon:'★', featured:true, label:'All-time leading horse',
    valueName: horseR.name + (horseR.origin?` <span class="origin">(${horseR.origin})</span>`:''),
    detail:`<strong>${horseR.wins} wins</strong> across ${horseR.seasons.size} ${horseR.seasons.size===1?'season':'seasons'} · trained by ${horseR.trainer||'—'}`,
    clickType:'horse', clickKey:horseR.name
  });
  const tMap = {};
  sList.forEach(s=>s.register.forEach(h=>{
    if(!h.trainer) return;
    tMap[h.trainer] = tMap[h.trainer]||{name:h.trainer, country:h.country, wins:0, horses:0, seasons:new Set()};
    tMap[h.trainer].wins += (h.wins||0);
    tMap[h.trainer].horses++; tMap[h.trainer].seasons.add(s.season);
    if(h.country) tMap[h.trainer].country = h.country;
  }));
  const tR = Object.values(tMap).sort((a,b)=>b.wins-a.wins||b.horses-a.horses)[0];
  if(tR) out.push({
    icon:'♦', label:'All-time leading trainer',
    valueName: tR.name,
    detail:`<strong>${tR.wins} wins</strong> from ${tR.horses} runners over ${tR.seasons.size} ${tR.seasons.size===1?'season':'seasons'}`,
    clickType:'trainer', clickKey:tR.name
  });
  const big = [...sList].sort((a,b)=>b.stats.horses-a.stats.horses)[0];
  if(big) out.push({
    icon:'△', label:'Largest international field',
    valueName: big.season,
    detail:`<strong>${big.stats.horses}</strong> overseas runners — a record season for international participation`,
    clickType:'season', clickKey:big.season
  });
  const winS = [...sList].sort((a,b)=>b.stats.wins-a.stats.wins)[0];
  if(winS) out.push({
    icon:'♛', label:'Most rewarding season',
    valueName: winS.season,
    detail:`<strong>${winS.stats.wins} wins</strong> from international raiders · <strong>${winS.stats.individual_winners}</strong> different ${winS.stats.individual_winners===1?'horse':'horses'}`,
    clickType:'season', clickKey:winS.season
  });
  const div = [...sList].sort((a,b)=>b.stats.countries.length-a.stats.countries.length)[0];
  if(div) out.push({
    icon:'◇', label:'Most diverse season',
    valueName: div.season,
    detail:`Runners from <strong>${div.stats.countries.length} nations</strong>: ${div.stats.countries.join(', ')}`,
    clickType:'season', clickKey:div.season
  });
  const cc = {};
  sList.forEach(s=>s.register.forEach(h=>{ if(h.country) cc[h.country] = (cc[h.country]||0)+1; }));
  const topN = Object.entries(cc).sort((a,b)=>b[1]-a[1])[0];
  if(topN){
    out.push({
      icon:'⚑', label:'Top sending nation',
      valueName: (COUNTRY_FULL[topN[0]]||topN[0]) + ` <span class="origin">${topN[0]}</span>`,
      detail:`<strong>${topN[1]} runners</strong> sent across all tracked seasons`,
      clickType:null
    });
  }
  return out;
}
function renderHallOfFame(root){
  const records = buildHallOfFame();
  if(!records.length) return;
  const sec = el('section',{class:'section'});
  sec.append(sectionHead("The <em>hall of fame</em>","all-time records · click any card"));
  const grid = el('div',{class:'hof-grid'});
  records.forEach((r,i)=>{
    const card = el('div',{class:'hof-card'+(r.featured?' featured':'')});
    card.style.animationDelay = (i*40)+'ms';
    card.append(
      el('div',{class:'hof-icon'}, r.icon),
      el('div',{class:'hof-label'}, r.label),
      el('div',{class:'hof-value', html: r.valueName}),
      el('div',{class:'hof-detail', html: r.detail})
    );
    if(r.clickType){
      card.addEventListener('click', ()=>{
        if(r.clickType==='horse') openHorseModal(r.clickKey);
        else if(r.clickType==='trainer') openTrainerModal(r.clickKey);
        else if(r.clickType==='season'){
          activeKey = r.clickKey;
          document.querySelectorAll('.tab').forEach(t=>{
            t.classList.remove('active');
            if(t.firstChild && t.firstChild.textContent === r.clickKey) t.classList.add('active');
          });
          renderActive();
          window.scrollTo({top: document.getElementById('seasonTabsWrap').offsetTop-80, behavior:'smooth'});
        }
      });
    } else {
      card.style.cursor = 'default';
    }
    grid.append(card);
  });
  sec.append(grid);
  root.append(sec);
}

/* =============================================================
   POST-RENDER INTERACTIVITY (timeline links)
   ============================================================= */
function enhanceInteractivity(root){
  root.querySelectorAll('.win-horse[data-horse]').forEach(elm=>{
    if(elm.dataset.wired) return;
    elm.dataset.wired = '1';
    elm.style.cursor = 'pointer';
    elm.addEventListener('click', ()=>openHorseModal(elm.dataset.horse));
  });
  root.querySelectorAll('.trainer-link[data-trainer]').forEach(elm=>{
    if(elm.dataset.wired) return;
    elm.dataset.wired = '1';
    const n = elm.dataset.trainer;
    if(n){
      elm.style.cursor = 'pointer';
      elm.style.color = 'var(--text-secondary)';
      elm.addEventListener('mouseenter', ()=>elm.style.color = 'var(--brand)');
      elm.addEventListener('mouseleave', ()=>elm.style.color = 'var(--text-secondary)');
      elm.addEventListener('click', ()=>openTrainerModal(n));
    }
  });
}
